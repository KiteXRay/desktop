name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: wails build -tags webkit2_41

      - name: Package Release Archive
        run: |
          mkdir -p release-pkg
          cp build/bin/kite release-pkg/
          cp scripts/install_linux.sh release-pkg/install.sh
          cp scripts/uninstall_linux.sh release-pkg/uninstall.sh
          cp scripts/grant_privileges.sh release-pkg/grant_privileges.sh
          cp build/appicon.png release-pkg/kite.png
          cp README.md LICENSE release-pkg/
          chmod +x release-pkg/install.sh release-pkg/uninstall.sh release-pkg/grant_privileges.sh release-pkg/kite
          tar -czvf kite-linux-amd64.tar.gz -C release-pkg .

      - name: Build Debian Package (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.1"; fi
          ./scripts/package_deb.sh "$VERSION" amd64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kite-linux-amd64.tar.gz
            build/bin/*.deb

  release-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            $nsisDir = "C:\Program Files\NSIS"
          }
          Write-Host "Configuring NSIS directory: $nsisDir"
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: pwsh
        run: |
          makensis /VERSION

      - name: Build Application with NSIS Installer
        run: wails build -platform windows/amd64 -nsis

      - name: Package Portable Zip
        shell: bash
        run: |
          mkdir -p release-win
          cp build/bin/kite.exe release-win/
          cp build/windows/wintun.dll release-win/
          cp README.md LICENSE release-win/
          cd release-win && 7z a -tzip ../kite-windows-amd64.zip *

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/*installer.exe
            kite-windows-amd64.zip

  release-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: wails build -platform darwin/universal

      - name: Package Release
        run: |
          cd build/bin
          zip -r ../../kite-macos-universal.zip Kite.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: kite-macos-universal.zip

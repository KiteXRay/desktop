name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Application
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.1.0"; fi
          wails build -tags webkit2_41 -skipbindings -ldflags "-X main.appVersion=${VERSION}"

      - name: Package Release Archive
        run: |
          mkdir -p release-pkg
          cp build/bin/kite release-pkg/
          cp scripts/install_linux.sh release-pkg/install.sh
          cp scripts/uninstall_linux.sh release-pkg/uninstall.sh
          cp scripts/grant_privileges.sh release-pkg/grant_privileges.sh
          cp build/appicon.png release-pkg/kite.png
          cp README.md LICENSE release-pkg/
          chmod +x release-pkg/install.sh release-pkg/uninstall.sh release-pkg/grant_privileges.sh release-pkg/kite
          tar -czvf kite-linux-amd64.tar.gz -C release-pkg .

      - name: Build Debian Package (.deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.1.0"; fi
          ./scripts/package_deb.sh "$VERSION" amd64

      - name: Clean Stale Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in checksums-linux.txt checksums-macos.txt checksums-windows.txt kite-windows-amd64.zip kite-macos-universal.zip; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" -y 2>/dev/null || true
          done

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            kite-linux-amd64.tar.gz
            build/bin/*.deb

  release-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            $nsisDir = "C:\Program Files\NSIS"
          }
          Write-Host "Configuring NSIS directory: $nsisDir"
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: pwsh
        run: |
          makensis /VERSION

      - name: Build Application with NSIS Installer
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "1.1.0" }
          wails build -platform windows/amd64 -nsis -skipbindings -ldflags "-X main.appVersion=$ver"
          $inst = Get-ChildItem -Path "build\bin" -Filter "*installer.exe" | Select-Object -First 1
          if ($inst) {
            $dest = Join-Path "build\bin" "kite-amd64-installer.exe"
            if ($inst.FullName -ne $dest) {
              Move-Item -Force $inst.FullName $dest
            }
          }

      - name: Clean Stale Windows Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in Kite-amd64-installer.exe kite-windows-amd64.zip; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" -y 2>/dev/null || true
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/kite-amd64-installer.exe

  release-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Application
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.1.0"; fi
          wails build -platform darwin/universal -skipbindings -ldflags "-X main.appVersion=${VERSION}"

      - name: Install create-dmg
        run: |
          brew install create-dmg || true

      - name: Package Release (.dmg)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.1.0"; fi
          ./scripts/package_dmg.sh "${VERSION}" "universal"
          cp build/bin/kite-macos-universal.dmg ./ || true

      - name: Clean Stale macOS Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in kite-macos-universal.zip checksums-macos.txt; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" -y 2>/dev/null || true
          done

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            kite-macos-universal.dmg
